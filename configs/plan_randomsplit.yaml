# Diagnostic runs for the random-split sanity check (see scripts/prepare_random_split.py). Run with
#   FISH_ENV=aigpu python scripts/queue_runner.py configs/plan_randomsplit.yaml
steps:
  - name: randomsplit-prepare
    skip_if: "data/processed/deepfish_randomsplit/prepare.json"
    cmd: ["{python}", "scripts/prepare_random_split.py"]
  - name: randomsplit-640
    skip_if: "runs/2026100[5-9]-yolov8n-640-randomsplit-s0/metrics.json"
    env: {FISH_ENV: aigpu}
    cmd: ["{python}", "scripts/train.py", "--config", "yolov8n_640_randomsplit", "--seed", "0", "--resume"]
  - name: randomsplit-960
    skip_if: "runs/2026100[5-9]-yolov8n-960-randomsplit-s0/metrics.json"
    env: {FISH_ENV: aigpu}
    cmd: ["{python}", "scripts/train.py", "--config", "yolov8n_960_randomsplit", "--seed", "0", "--resume"]
