# 3-seed confirmation of the best recipe (seed 0 exists: F23 arm A) and one seed of YOLOv8s on the same data.
# Run with: FISH_ENV=aigpu python scripts/queue_runner.py configs/plan_confirm.yaml
steps:
  - name: confirm-s1
    skip_if: "runs/2026100[5-9]-yolov8n-960-kakadu-ozfish-s1/metrics.json"
    env: {FISH_ENV: aigpu}
    cmd: ["{python}", "scripts/train.py", "--config", "yolov8n_960_kakadu_ozfish", "--seed", "1", "--resume"]
  - name: confirm-s2
    skip_if: "runs/2026100[5-9]-yolov8n-960-kakadu-ozfish-s2/metrics.json"
    env: {FISH_ENV: aigpu}
    cmd: ["{python}", "scripts/train.py", "--config", "yolov8n_960_kakadu_ozfish", "--seed", "2", "--resume"]
  - name: v8s-combined
    skip_if: "runs/2026100[5-9]-yolov8s-960-kakadu-ozfish-s0/metrics.json"
    env: {FISH_ENV: aigpu}
    cmd: ["{python}", "scripts/train.py", "--config", "yolov8s_960_kakadu_ozfish", "--seed", "0", "--resume"]
