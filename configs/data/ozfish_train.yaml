# OzFish labelled frames that are NOT in the sealed test set or in any test deployment, built by
# scripts/prepare_ozfish_train.py --val-frac 0.2 --drop-below 4.0. images/train is for training; images/val holds out whole
# deployments as a decision-only validation set (not perfectly leak-free: one reef can span deployments).
# Training on this changes what the sealed OzFish test measures; see docs/data_audit.md.
path: processed/ozfish_train
train: images/train
val: images/val
names:
  0: fish
