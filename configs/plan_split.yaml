# Split test of the combined recipe (PROGRESS F22): which of its two changes helped. Run with
#   FISH_ENV=aigpu python scripts/queue_runner.py configs/plan_split.yaml
steps:
  - name: split-ozfish-only
    skip_if: "runs/2026100[5-9]-yolov8n-960-kakadu-ozfish-s0/metrics.json"
    env: {FISH_ENV: aigpu}
    cmd: ["{python}", "scripts/train.py", "--config", "yolov8n_960_kakadu_ozfish", "--seed", "0", "--resume"]
  - name: split-aug-only
    skip_if: "runs/2026100[5-9]-yolov8n-960-kakadu-aug-s0/metrics.json"
    env: {FISH_ENV: aigpu}
    cmd: ["{python}", "scripts/train.py", "--config", "yolov8n_960_kakadu_aug", "--seed", "0", "--resume"]
