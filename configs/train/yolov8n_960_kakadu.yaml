# FD-135. Identical to yolov8n_960 except the training data: DeepFish train + Kakadu train
# (<= 15 frames per scene group, one class). Validation is still the DeepFish val split, so the
# number is directly comparable with the yolov8n_960 control run on the same machine. Compare on
# 3 seeds before believing any difference (the 960 baseline seed spread is 0.034 mAP@50).
name: yolov8n-960-kakadu
model: yolov8n.pt   # NOTE (FD-008): COCO weights are AGPL-3.0; see yolov8n_960.yaml.
data: deepfish_kakadu

imgsz: 960
epochs: 150
patience: 30
seeds: [0, 1, 2]
batch: null
workers: null
amp: null
close_mosaic: 10

val_conf: 0.001
val_iou: 0.7
extra:
  plots: true
