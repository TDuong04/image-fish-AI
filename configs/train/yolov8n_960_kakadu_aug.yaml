# Split test, arm B: Kakadu-only data with the STRONGER augmentation of yolov8n_960_aug (scale 0.9, hue 0.05, saturation 0.8,
# value 0.5), no OzFish. Compare with the Kakadu-only 3-seed arm and with the combined recipe (yolov8n_960_all). One seed: a screen.
name: yolov8n-960-kakadu-aug
model: yolov8n.pt   # NOTE (FD-008): COCO weights are AGPL-3.0; see yolov8n_960.yaml.
data: deepfish_kakadu

imgsz: 960
epochs: 150
patience: 30
seeds: [0]
batch: null
workers: null
amp: null
close_mosaic: 10

val_conf: 0.001
val_iou: 0.7
extra:
  plots: true
  scale: 0.9
  hsv_h: 0.05
  hsv_s: 0.8
  hsv_v: 0.5
