# FD-020 / FD-022. Single-class fish detection on DeepFish, site-level split.
#
# Resolution is the central variable in this project. From docs/data_audit.md,
# the fraction of boxes below 16 px -- roughly the floor of what a stride-8 P3
# head can resolve -- is 14.4% at 640 and 2.3% at 960. Higher input resolution
# recovers small fish; it is also the single most expensive thing to ask of an
# Orin Nano. That trade-off is the project's research question, not a detail.
name: yolov8n-960
model: yolov8n.pt   # NOTE (FD-008): COCO weights are AGPL-3.0 and the trained
                    # checkpoint inherits it. Settle the licence before shipping.
data: deepfish

imgsz: 960
epochs: 150         # upper bound; patience stops it
patience: 30
seeds: [0, 1, 2]    # FD-103: >=3 seeds for any comparison that drives a decision
batch: null         # derived from detected VRAM
workers: null
amp: null
close_mosaic: 10

val_conf: 0.001
val_iou: 0.7
extra:
  plots: true
