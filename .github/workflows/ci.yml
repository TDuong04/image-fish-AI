name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Light install on purpose: the tests cover paths, dataset grouping, statistics,
      # documentation traceability and the edge runner's pure-Python parts. Training and
      # TensorRT are not exercised here (they need a GPU / a Jetson); the one test that
      # needs torch skips itself when torch is missing.
      - run: python -m pip install pytest numpy pyyaml pillow opencv-python-headless
      - run: python -m pytest
